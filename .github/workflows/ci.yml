name: RevertProof CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: revertproof_test
          POSTGRES_USER: rp_tester
          POSTGRES_PASSWORD: rp_ci_ephemeral_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e ".[postgres,dev]"
      - name: Lint with Ruff
        run: ruff check src tests
      - name: Run full pytest suite (SQLite + PostgreSQL)
        env:
          RP_DATABASE_URL: postgresql://rp_tester:rp_ci_ephemeral_only@localhost:5432/revertproof_test
        run: pytest -v --cov=revertproof
      - name: Verify safe migration passes safety gate on PostgreSQL
        env:
          RP_DATABASE_URL: postgresql://rp_tester:rp_ci_ephemeral_only@localhost:5432/revertproof_test
        run: revertproof verify sql/safe_expand.sql --domain banking --fixtures 1000
      - name: Verify unsafe migration is BLOCKED by safety gate on PostgreSQL
        env:
          RP_DATABASE_URL: postgresql://rp_tester:rp_ci_ephemeral_only@localhost:5432/revertproof_test
        run: |
          if revertproof verify sql/unsafe_v2.sql --domain banking --fixtures 1000; then
            echo "ERROR: Unsafe migration was NOT blocked!"
            exit 1
          else
            echo "SUCCESS: Unsafe migration was properly blocked with non-zero exit code."
          fi
